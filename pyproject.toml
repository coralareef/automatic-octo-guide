[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokequant"
version = "0.1.0"
description = "Quantitative Pokemon Showdown metagame analysis and team optimization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "coralareef"}]
dependencies = []

[project.scripts]
pokequant = "pokequant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
