name: Live data smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/live-data-smoke.yml"
      - "sim/**"
      - "src/pokequant/simulator.py"
      - "src/pokequant/sets.py"
      - "src/pokequant/optimizer/**"
      - "src/pokequant/analysis/meta.py"
      - "src/pokequant/analysis/threats.py"
      - "src/pokequant/analysis/population.py"
      - "src/pokequant/models.py"
      - "tests/fixtures/legal_gen9ou.txt"

jobs:
  live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -e .
      - run: npm install --no-audit --no-fund
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Official Showdown legality smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          from pokequant.simulator import validate_team
          team = Path("tests/fixtures/legal_gen9ou.txt").read_text()
          result = validate_team(team, format="gen9ou")
          print({"valid": result.valid, "pokemon": result.pokemon, "problems": result.problems})
          assert result.valid, result.problems
          assert len(result.pokemon) == 6
          PY
      - name: Official Showdown default-policy battle smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          from pokequant.simulator import simulate_default
          team = Path("tests/fixtures/legal_gen9ou.txt").read_text()
          result = simulate_default(team, team, format="gen9ou", seed="1,2,3,4", max_turns=500)
          print({"winner": result.winner, "turns": result.turns, "requests": result.requests, "errors": result.errors})
          assert result.winner in {"P1", "P2", "tie"}
          assert result.turns > 0
          PY
      - name: Official Showdown heuristic-policy battle smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          from pokequant.simulator import simulate_heuristic
          team = Path("tests/fixtures/legal_gen9ou.txt").read_text()
          result = simulate_heuristic(team, team, format="gen9ou", seed="9,8,7,6", max_turns=500)
          print({"winner": result.winner, "turns": result.turns, "requests": result.requests, "errors": result.errors, "policy": result.policy})
          assert result.winner in {"P1", "P2", "tie"}
          assert result.turns > 0
          assert result.policy == "heuristic"
          assert result.errors == 0
          PY
      - name: Ingest August 2026 high-ladder meta
        run: |
          pokequant warehouse-meta \
            --db data/live-smoke.db \
            --start 2026-08 \
            --end 2026-08 \
            --format gen9ou \
            --rating 1825
      - name: Validate optimizer-generated exact team
        run: |
          python - <<'PY'
          from pokequant.analysis.meta import parse_chaos, rank_pokemon
          from pokequant.analysis.threats import rank_counter_answers, team_threat_coverage
          from pokequant.clients.smogon import get_chaos
          from pokequant.config import MetaTarget
          from pokequant.optimizer.team import beam_search
          from pokequant.sets import generate_team_set_candidates
          from pokequant.simulator import validate_team

          target = MetaTarget(month="2026-08", format="gen9ou", rating=1825)
          records = parse_chaos(get_chaos(target))
          ranked = rank_pokemon(records)
          teams = beam_search(
              records,
              ranked,
              pool_size=40,
              beam_width=250,
              team_size=6,
              threat_top_n=30,
          )
          assert teams, "species optimizer returned no teams"
          top = teams[0]
          coverage = team_threat_coverage(top.members, records, top_n=30)
          answers = rank_counter_answers(records, top_n_threats=30)[:10]
          print({
              "species_team": top.members,
              "score": round(top.score, 4),
              "usage": round(top.usage_score, 4),
              "synergy": round(top.synergy_score, 4),
              "diversity": round(top.diversity_score, 4),
              "threat": round(top.threat_score, 4),
              "uncovered_usage_mass": round(coverage.uncovered_usage_mass, 4),
              "top_counter_answers": [(r.answer, round(r.score, 4)) for r in answers],
          })

          variants = generate_team_set_candidates(
              top.members,
              records,
              per_species=8,
              beam_width=96,
              limit=48,
          )
          assert variants, "set generator returned no exact teams"
          valid = None
          attempted = 0
          last_problems = ()
          for variant in variants:
              attempted += 1
              if min(candidate.coherence_score for candidate in variant.sets) < 0.20:
                  continue
              checked = validate_team(variant.export(), format="gen9ou")
              if checked.valid:
                  valid = (variant, checked)
                  break
              last_problems = checked.problems

          print({"set_variants_attempted": attempted, "valid_found": valid is not None})
          if valid is None:
              print({"last_validation_problems": last_problems})
          assert valid is not None, last_problems
          variant, checked = valid
          print("SET_COHERENCE", [
              (candidate.species, candidate.item, round(candidate.coherence_score, 3))
              for candidate in variant.sets
          ])
          assert min(candidate.coherence_score for candidate in variant.sets) >= 0.20
          print("OPTIMIZER_LEGAL_TEAM_START")
          print(checked.export)
          print("OPTIMIZER_LEGAL_TEAM_END")
          PY
      - name: Ingest 200 public Gen 9 OU replays
        run: |
          pokequant warehouse-replays \
            --db data/live-smoke.db \
            --format gen9ou \
            --limit 200 \
            --sleep 0.05
      - name: Warehouse stats
        run: pokequant warehouse-stats --db data/live-smoke.db
      - name: Validate canonical and high-ladder rows
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("data/live-smoke.db")
          total = db.execute("SELECT COUNT(*) FROM replays WHERE format='gen9ou'").fetchone()[0]
          rated = db.execute("SELECT COUNT(*) FROM replays WHERE format='gen9ou' AND rating IS NOT NULL").fetchone()[0]
          decisive = db.execute("SELECT COUNT(*) FROM replays WHERE format='gen9ou' AND rating>=1400 AND winner_side IS NOT NULL").fetchone()[0]
          members = db.execute("SELECT COUNT(*) FROM team_members").fetchone()[0]
          print({"canonical": total, "rated": rated, "high_ladder_decisive": decisive, "team_members": members})
          assert total == 200, ("canonical format regression", total)
          assert rated > 0, "no ratings recovered"
          assert decisive > 0, "no high-ladder decisive rows"
          assert members <= total * 12, ("team identity inflation", members)
          PY
      - name: Empirical Pokemon sample
        run: |
          pokequant empirical-pokemon \
            --db data/live-smoke.db \
            --format gen9ou \
            --min-rating 1400 \
            --prior 12 \
            --top 20
      - name: Empirical pair sample
        run: |
          pokequant empirical-pairs \
            --db data/live-smoke.db \
            --format gen9ou \
            --min-rating 1400 \
            --min-games 2 \
            --prior 12 \
            --top 20
      - name: Empirical matchup sample
        run: |
          pokequant empirical-matchups \
            --db data/live-smoke.db \
            --format gen9ou \
            --min-rating 1400 \
            --min-games 3 \
            --prior 6 \
            --top 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pokequant-live-smoke
          path: data/live-smoke.db
          if-no-files-found: warn
