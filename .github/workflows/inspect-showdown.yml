name: Inspect Showdown payload

on:
  push:
    paths:
      - ".github/workflows/inspect-showdown.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Print sanitized payload shapes
        run: |
          python - <<'PY'
          import json
          from pokequant.clients.showdown import search_replays, get_replay
          rows = search_replays(format="gen9ou")
          stub = rows[0]
          print("stub_keys=", sorted(stub.keys()))
          payload = get_replay(str(stub["id"]))
          print("replay_keys=", sorted(payload.keys()))
          print("formatid=", repr(payload.get("formatid")))
          inputlog = str(payload.get("inputlog", ""))
          lines = inputlog.splitlines()
          print("inputlog_lines=", len(lines))
          for side in ("p1", "p2"):
              prefix = f">player {side} "
              found = next((line for line in lines if line.startswith(prefix)), None)
              if found is None:
                  print(side, "player_command=missing")
                  continue
              raw = found[len(prefix):]
              try:
                  obj = json.loads(raw)
              except Exception:
                  print(side, "player_command_json=False", "length=", len(raw))
                  continue
              print(
                  side,
                  "player_keys=", sorted(obj.keys()),
                  "team_present=", bool(obj.get("team")),
                  "team_length=", len(str(obj.get("team", ""))),
              )
          print("team_order_commands=", sum(1 for line in lines if line.startswith(">p1 team ") or line.startswith(">p2 team ")))
          PY
