name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  dashboard-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dashboard]"
      - run: python -m py_compile dashboard/app.py
      - name: Start dashboard and verify health endpoint
        run: |
          streamlit run dashboard/app.py --server.headless true --server.port 8501 > /tmp/pokequant-dashboard.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "dashboard healthy"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pokequant-dashboard.log
          exit 1
